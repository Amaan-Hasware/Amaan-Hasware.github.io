<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#0d0c0b"/>

  <!-- Letter A  (thin elegant strokes, serif-style) -->
  <!-- Left leg -->
  <line x1="14" y1="78" x2="31" y2="22" stroke="#f0ece4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="31" y1="22" x2="48" y2="78" stroke="#f0ece4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="20" y1="55" x2="42" y2="55" stroke="#f0ece4" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Serif top cap (very thin) -->
  <line x1="28" y1="22" x2="34" y2="22" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Serif feet -->
  <line x1="11"  y1="78" x2="18"  y2="78" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="44"  y1="78" x2="51"  y2="78" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Letter H -->
  <!-- Left vertical -->
  <line x1="57" y1="22" x2="57" y2="78" stroke="#f0ece4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right vertical -->
  <line x1="79" y1="22" x2="79" y2="78" stroke="#f0ece4" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="57" y1="50" x2="79" y2="50" stroke="#f0ece4" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Serif feet left -->
  <line x1="54" y1="78" x2="61" y2="78" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="54" y1="22" x2="61" y2="22" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Serif feet right -->
  <line x1="76" y1="78" x2="83" y2="78" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="76" y1="22" x2="83" y2="22" stroke="#f0ece4" stroke-width="1.4" stroke-linecap="round"/>
</svg>
