<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-inner container-wide">

    <a class="nav-logo" href="#hero" (click)="closeMenu()">AH</a>

    <ul class="nav-links" [class.open]="menuOpen">
      @for (link of navLinks; track link.label) {
        <li>
          <a [href]="link.href"
             [class.active]="activeSection === link.href.slice(1)"
             (click)="closeMenu()">
            {{ link.label }}
          </a>
        </li>
      }
      <li>
        <a href="mailto:haswareamaan2003@gmail.com" class="nav-contact" (click)="closeMenu()">
          Contact
        </a>
      </li>
    </ul>

    <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Toggle menu">
      <span></span><span></span>
    </button>

  </div>
</nav>
