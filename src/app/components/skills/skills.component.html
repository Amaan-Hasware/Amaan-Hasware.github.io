<section id="skills" class="skills">
  <div class="container">

    <span class="section-index reveal">03 &mdash; Skills</span>
    <h2 class="section-title reveal">What I work with.</h2>

    <div class="skill-list">
      @for (cat of categories; track cat.title; let i = $index; let last = $last) {
        <div class="skill-row reveal" [class]="'delay-' + (i + 1)">
          <div class="skill-row-label">{{ cat.title }}</div>
          <div class="skill-row-items">{{ joinSkills(cat.skills) }}</div>
        </div>
        @if (!last) { <div class="skill-rule"></div> }
      }
    </div>

  </div>
</section>
